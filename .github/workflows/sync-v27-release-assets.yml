name: Sync VIPER v27 release assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.exe"
      - ".github/workflows/sync-v27-release-assets.yml"

permissions:
  contents: write

jobs:
  sync-release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v27 patchers
        uses: actions/checkout@v4

      - name: Replace v1.0.0 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.0 ./*.exe --clobber --repo "$GITHUB_REPOSITORY"
