name: Publish VIPER RSR and BTR release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "VIPER_RSR_Korean_Patch.exe"
      - "VIPER_RSR_Korean_Patch_v1.zip"
      - "VIPER_BTR_Korean_xdelta_v1.zip"
      - "README_KO.md"
      - "RELEASE_MANIFEST_v1.json"
      - "SHA256SUMS.txt"
      - ".github/workflows/publish-rsr-btr-v1.yml"

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sealed patch packages
        uses: actions/checkout@v4

      - name: Create v1.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v1.1.0
          VIPER_RSR_Korean_Patch.exe
          VIPER_RSR_Korean_Patch_v1.zip
          VIPER_BTR_Korean_xdelta_v1.zip
          RELEASE_MANIFEST_v1.json
          SHA256SUMS.txt
          --verify-tag
          --title "VIPER RSR·BTR 별도 한국어 패치 v1"
          --notes-file README_KO.md
          --repo "$GITHUB_REPOSITORY"
